function printLine(text){
    const div = document.createElement("div");
    div.className = "output-line";
    div.innerHTML = text;
    output.appendChild(div);

    window.scrollTo(0, document.body.scrollHeight);
}

function showWelcome(){
    printLine(translations[currentLang].welcome);
}

showWelcome();

function showMap(){

    printLine(translations[currentLang].mapText);

    const mapDiv = document.createElement("div");
    mapDiv.id = "map";

    output.appendChild(mapDiv);

    const map = L.map(mapDiv).setView([48.5956, 37.9999], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution:'© OpenStreetMap'
    }).addTo(map);

    L.marker([48.5956, 37.9999])
        .addTo(map)
        .bindPopup("Bakhmut, Ukraine")
        .openPopup();
}

input.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        const raw = input.value.trim();

        if(!raw) return;

        printLine(`<span class="prompt">mikhail@portfolio:~$</span> ${raw}`);

        const cmd = raw.toLowerCase();

        if(cmd === "help"){
            printLine(translations[currentLang].help);
        }

        else if(translations[currentLang][cmd]){
            printLine(translations[currentLang][cmd]);
        }

        else if(cmd.startsWith("lang ")){

            const lang = cmd.split(" ")[1];

            if(["en","de","ru"].includes(lang)){
                currentLang = lang;
                printLine(`<span class="success">Language switched to ${lang}</span>`);
            } else {
                printLine(`<span class="error">Unknown language</span>`);
            }
        }

        else if(cmd === "clear"){
            output.innerHTML = "";
        }

        else if(cmd === "map"){
            showMap();
        }

        else{
            printLine(`<span class="error">Command not found: ${raw}</span>`);
        }

        input.value = "";
    }

});
