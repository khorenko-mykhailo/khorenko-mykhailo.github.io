<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070707;
    color:#00ff88;
    font-family:Consolas, monospace;
    overflow-x:hidden;
}

#topbar{
    width:100%;
    border-bottom:1px solid #133;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#00ff88;
    background:#0a0a0a;
    position:sticky;
    top:0;
    z-index:999;
}

#terminal{
    max-width:1400px;
    margin:20px auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.panel{
    border:1px solid #1d1d1d;
    background:#0f0f0f;
    border-radius:12px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,255,120,0.05);
}

.output-line{
    margin-bottom:10px;
    white-space:pre-wrap;
}

.prompt{
    color:#00d9ff;
}

.highlight{
    color:#ffe600;
}

.error{
    color:#ff4d4d;
}

.success{
    color:#00ff88;
}

.info{
    color:#ddd;
}

.input-line{
    display:flex;
    align-items:center;
    margin-top:10px;
}

#cmd-input{
    background:transparent;
    border:none;
    outline:none;
    color:#00ff88;
    font-size:16px;
    font-family:inherit;
    flex:1;
}

.avatar{
    width:100%;
    border-radius:10px;
    border:1px solid #1f1f1f;
}

.section-title{
    color:#00ff88;
    margin-bottom:15px;
}

.social a{
    display:block;
    margin-bottom:10px;
    color:#00d9ff;
    text-decoration:none;
}

.social a:hover{
    color:#fff;
}

#map{
    width:100%;
    height:350px;
    border-radius:10px;
    margin-top:10px;
}

.legend{
    margin-top:15px;
    line-height:1.7;
}

.dot{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    margin-right:8px;
}

.red{ background:red; }
.blue{ background:#00a2ff; }
.green{ background:#00ff88; }
.purple{ background:#d400ff; }

.footer{
    margin-top:20px;
    text-align:center;
    color:#777;
}

.typing{
    overflow:hidden;
    border-right:2px solid #00ff88;
    white-space:nowrap;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        border-color:transparent;
    }
}

@media(max-width:1000px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>

function print(text){

    const div = document.createElement("div");

    div.className = "output-line";

    div.innerHTML = text;

    output.appendChild(div);

    window.scrollTo(0, document.body.scrollHeight);

}

function boot(){

    print(`
<span class="success">
SYSTEM ONLINE
</span>
`);

    print(data[currentLang].welcome);

}

boot();

const commands = {

help(){
    print(data[currentLang].help);
},

profile(){
    print(data[currentLang].profile);
},

education(){
    print(data[currentLang].education);
},

experience(){
    print(data[currentLang].experience);
},

skills(){

},

projects(){

},

contacts(){

map(){

},

download(){

File:
Mikhail_Khorenko_CV.pdf

Status:
<span class="success">Done</span>
`);

},

clear(){

    output.innerHTML = "";

}

};

input.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        const raw = input.value.trim();

        if(!raw) return;

        history.push(raw);

        historyIndex = history.length;

        print(`<span class="prompt">mikhail@portfolio:~$</span> ${raw}`);

        const cmd = raw.toLowerCase();

        if(cmd.startsWith("lang ")){

            const lang = cmd.split(" ")[1];

            if(["en","de","ru"].includes(lang)){

                currentLang = lang;

                print(`<span class="success">Language changed to ${lang}</span>`);

            } else {

                print(`<span class="error">Unknown language</span>`);

            }

        }

        else if(commands[cmd]){

            commands[cmd]();

        }

        else{

            print(`<span class="error">Command not found</span>`);

        }

        input.value = "";

    }

    if(e.key === "ArrowUp"){

        e.preventDefault();

        if(historyIndex > 0){

            historyIndex--;

            input.value = history[historyIndex];

        }

    }

    if(e.key === "ArrowDown"){

        e.preventDefault();

        if(historyIndex < history.length - 1){

            historyIndex++;

            input.value = history[historyIndex];

        } else {

            input.value = "";

        }

    }

});
